openapi: 3.1.0
info:
  title: "VNU Đăng ký học phần"
  version: "1.0"
  description: "JSON camelCase; thời gian ISO 8601 UTC. Lỗi có dạng {code, message, details}."

servers:
  - url: /api/v1
    description: Base API path

tags:
  - name: auth
    description: Xác thực người dùng
  - name: student
    description: Các thao tác dành cho sinh viên
  - name: admin
    description: Các thao tác quản trị
  - name: public
    description: Endpoint công khai (qua Tailscale)
  - name: health
    description: Kiểm tra trạng thái hệ thống

paths:

  /auth/login:
    post:
      tags: [auth]
      summary: Đăng nhập
      description: Xác thực sinh viên hoặc admin, trả về JWT access token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          description: Đăng nhập không được phép
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                loginNotOpen:
                  summary: Ngoài giờ đăng nhập
                  value:
                    code: LOGIN_NOT_OPEN
                    message: "Chưa đến giờ đăng nhập."
                    details: null
                adminLoginLocked:
                  summary: Admin bị khóa trong đợt OPEN
                  value:
                    code: ADMIN_LOGIN_LOCKED
                    message: "Admin không được đăng nhập khi đợt đăng ký đang mở."
                    details: null
        '429':
          description: Vượt giới hạn tốc độ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: RATE_LIMITED
                message: "Quá nhiều lần thử đăng nhập. Vui lòng thử lại sau."
                details: null
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'

  /me:
    get:
      tags: [auth, student]
      summary: Thông tin tài khoản hiện tại
      description: Trả về thông tin người dùng đang đăng nhập.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'

  /registration:
    get:
      tags: [public]
      summary: Thông tin đợt đăng ký hiện tại
      description: Trả về thông tin đợt đăng ký học phần và thời gian server. Hỗ trợ ETag/304.
      operationId: getRegistration
      responses:
        '200':
          description: Thông tin đợt đăng ký
          headers:
            ETag:
              schema:
                type: string
              description: ETag để caching phía client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '304':
          description: Nội dung không thay đổi (ETag khớp)
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'

  /sections:
    get:
      tags: [public]
      summary: Danh sách lớp học phần
      description: Tìm kiếm và phân trang danh sách lớp học phần. Hỗ trợ ETag/304.
      operationId: getSections
      parameters:
        - name: term
          in: query
          description: Lọc theo học kỳ
          schema:
            type: string
            maxLength: 10
        - name: courseCode
          in: query
          description: Lọc theo mã học phần
          schema:
            type: string
            maxLength: 12
        - name: q
          in: query
          description: Tìm kiếm toàn văn
          schema:
            type: string
            maxLength: 150
        - name: hasSeats
          in: query
          description: Chỉ trả về lớp còn chỗ
          schema:
            type: boolean
        - name: cursor
          in: query
          description: Con trỏ phân trang (cursor-based)
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          description: Số lượng kết quả mỗi trang (mặc định 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Danh sách lớp học phần
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionListResponse'
        '304':
          description: Nội dung không thay đổi (ETag khớp)
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'

  /enrollments:
    get:
      tags: [student]
      summary: Danh sách lớp đã đăng ký
      description: Trả về danh sách lớp học phần sinh viên đã đăng ký, phân nhóm theo học kỳ.
      operationId: getEnrollments
      security:
        - bearerAuth: []
      parameters:
        - name: term
          in: query
          description: Lọc theo học kỳ
          schema:
            type: string
            maxLength: 10
      responses:
        '200':
          description: Danh sách đăng ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'

    post:
      tags: [student]
      summary: Đăng ký học phần
      description: Đăng ký một hoặc nhiều lớp học phần. Hỗ trợ idempotency key.
      operationId: createEnrollments
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Khóa idempotency (1–128 ký tự) để tránh đăng ký trùng lặp
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: Đăng ký thành công
          headers:
            X-Idempotent-Replay:
              schema:
                type: boolean
              description: true nếu đây là phản hồi được phát lại từ idempotency cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Đăng ký không được phép
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: REGISTRATION_NOT_OPEN
                message: "Đợt đăng ký học phần chưa mở hoặc đã đóng."
                details: null
        '404':
          description: Lớp học phần không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: SECTION_NOT_FOUND
                message: "Không tìm thấy lớp học phần."
                details: null
        '409':
          description: Xung đột dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                sectionFull:
                  summary: Lớp đã đầy
                  value:
                    code: SECTION_FULL
                    message: "Lớp học phần đã đạt sĩ số tối đa."
                    details: null
                sectionAlreadyEnrolled:
                  summary: Đã đăng ký lớp này
                  value:
                    code: SECTION_ALREADY_ENROLLED
                    message: "Sinh viên đã đăng ký lớp học phần này rồi."
                    details: null
                courseAlreadyEnrolled:
                  summary: Đã đăng ký học phần này
                  value:
                    code: COURSE_ALREADY_ENROLLED
                    message: "Sinh viên đã đăng ký học phần này ở lớp khác."
                    details: null
                idempotencyKeyReused:
                  summary: Key đã dùng với dữ liệu khác
                  value:
                    code: IDEMPOTENCY_KEY_REUSED
                    message: "Idempotency-Key đã được dùng với payload khác."
                    details: null
        '422':
          description: Lỗi nghiệp vụ không thể xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                sectionTermMismatch:
                  summary: Lớp không cùng học kỳ
                  value:
                    code: SECTION_TERM_MISMATCH
                    message: "Các lớp đăng ký phải thuộc cùng một học kỳ."
                    details: null
                sessionConflict:
                  summary: Trùng ca học
                  value:
                    code: SESSION_CONFLICT
                    message: "Có xung đột ca học giữa các lớp đã đăng ký."
                    details: null
                creditLimitExceeded:
                  summary: Vượt giới hạn tín chỉ
                  value:
                    code: CREDIT_LIMIT_EXCEEDED
                    message: "Tổng số tín chỉ vượt quá giới hạn cho phép."
                    details: null
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'

  /enrollments/{enrollmentId}:
    delete:
      tags: [student]
      summary: Hủy đăng ký học phần
      description: Hủy đăng ký một lớp học phần theo ID đăng ký.
      operationId: deleteEnrollment
      security:
        - bearerAuth: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          description: ID bản ghi đăng ký
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Hủy đăng ký thành công (không có nội dung trả về)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy đăng ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: ENROLLMENT_NOT_FOUND
                message: "Không tìm thấy bản ghi đăng ký."
                details: null
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'

  /admin/sections/{sectionId}:
    put:
      tags: [admin]
      summary: Tạo hoặc cập nhật lớp học phần
      description: Upsert lớp học phần theo sectionId. Trả về 201 nếu tạo mới, 200 nếu cập nhật.
      operationId: upsertSection
      security:
        - bearerAuth: []
      parameters:
        - name: sectionId
          in: path
          required: true
          description: ID lớp học phần
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionUpsertRequest'
      responses:
        '200':
          description: Lớp học phần đã được cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionResponse'
        '201':
          description: Lớp học phần mới được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Lỗi nghiệp vụ không thể xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                capacityBelowEnrolled:
                  summary: Sĩ số tối đa nhỏ hơn số sinh viên đã đăng ký
                  value:
                    code: CAPACITY_BELOW_ENROLLED
                    message: "Sĩ số mới không thể nhỏ hơn số sinh viên đã đăng ký."
                    details: null
                sectionHasEnrollments:
                  summary: Lớp đã có sinh viên, không cho phép xóa
                  value:
                    code: SECTION_HAS_ENROLLMENTS
                    message: "Lớp học phần đã có sinh viên đăng ký."
                    details: null
                courseNotFound:
                  summary: Mã học phần không tồn tại
                  value:
                    code: COURSE_NOT_FOUND
                    message: "Không tìm thấy học phần với mã đã cung cấp."
                    details: null
                registrationNotFound:
                  summary: Không tìm thấy đợt đăng ký
                  value:
                    code: REGISTRATION_NOT_FOUND
                    message: "Không tìm thấy đợt đăng ký cho học kỳ này."
                    details: null
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'

  /admin/registration:
    put:
      tags: [admin]
      summary: Tạo hoặc cập nhật đợt đăng ký
      description: Upsert thông tin đợt đăng ký học phần.
      operationId: upsertRegistration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationUpsertRequest'
      responses:
        '200':
          description: Đợt đăng ký đã được tạo/cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Period'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Đã tồn tại đợt đang mở
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: OPEN_PERIOD_EXISTS
                message: "Đã có đợt đăng ký đang ở trạng thái OPEN."
                details: null
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/AuthNotConfigured'

  /health:
    get:
      tags: [health]
      summary: Kiểm tra trạng thái hệ thống
      description: Chỉ truy cập được từ IP được whitelist. Không yêu cầu JWT.
      operationId: getHealth
      responses:
        '200':
          description: Hệ thống hoạt động bình thường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '403':
          description: IP không được phép truy cập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: FORBIDDEN
                message: "Địa chỉ IP không được phép truy cập endpoint này."
                details: null
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Access Token nhận được từ POST /auth/login

  schemas:

    # ── Auth ──────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [code, password]
      properties:
        code:
          type: string
          maxLength: 20
          description: Mã sinh viên hoặc mã admin
          example: "22000001"
        password:
          type: string
          maxLength: 72
          format: password
          description: Mật khẩu tài khoản
          example: "s3cr3tP@ssw0rd"

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT access token
        tokenType:
          type: string
          description: Loại token (thường là "Bearer")
          example: Bearer
        expiresIn:
          type: number
          description: Thời gian hết hạn tính bằng giây
          example: 3600

    MeResponse:
      type: object
      required: [id, code, fullName, role]
      properties:
        id:
          type: integer
          format: int64
          description: ID nội bộ của tài khoản
          example: 42
        code:
          type: string
          description: Mã sinh viên / admin
          example: "22000001"
        fullName:
          type: string
          description: Họ và tên đầy đủ
          example: "Nguyễn Văn A"
        role:
          type: string
          enum: [STUDENT, ADMIN]
          description: Vai trò tài khoản
          example: STUDENT
        creditLimit:
          type: integer
          nullable: true
          description: Giới hạn tín chỉ áp dụng cho sinh viên (null nếu không giới hạn hoặc là admin)
          example: 24

    # ── Registration / Period ─────────────────────────────────────────────────
    Period:
      type: object
      required: [term, loginOpensAt, opensAt, closesAt, status, creditLimit]
      properties:
        term:
          type: string
          maxLength: 10
          description: Học kỳ (VD "20241")
          example: "20241"
        loginOpensAt:
          type: string
          format: date-time
          description: Thời điểm bắt đầu mở đăng nhập (ISO 8601 UTC)
          example: "2024-11-01T00:00:00Z"
        opensAt:
          type: string
          format: date-time
          description: Thời điểm bắt đầu đăng ký (ISO 8601 UTC)
          example: "2024-11-01T08:00:00Z"
        closesAt:
          type: string
          format: date-time
          description: Thời điểm đóng đăng ký (ISO 8601 UTC)
          example: "2024-11-07T17:00:00Z"
        status:
          type: string
          enum: [OPEN, CLOSED]
          description: Trạng thái đợt đăng ký
          example: OPEN
        creditLimit:
          type: integer
          minimum: 1
          maximum: 32767
          description: Giới hạn tín chỉ tối đa có thể đăng ký trong đợt
          example: 24

    RegistrationResponse:
      type: object
      required: [serverTime]
      properties:
        registration:
          allOf:
            - $ref: '#/components/schemas/Period'
          nullable: true
          description: Thông tin đợt đăng ký hiện tại (null nếu chưa có đợt nào)
        serverTime:
          type: string
          format: date-time
          description: Thời gian hiện tại của server (ISO 8601 UTC)
          example: "2024-11-01T09:30:00Z"

    RegistrationUpsertRequest:
      type: object
      required: [term, loginOpensAt, opensAt, closesAt, status, creditLimit]
      properties:
        term:
          type: string
          maxLength: 10
          description: Học kỳ
          example: "20241"
        loginOpensAt:
          type: string
          format: date-time
          description: Thời điểm mở đăng nhập (ISO 8601)
          example: "2024-11-01T00:00:00Z"
        opensAt:
          type: string
          format: date-time
          description: Thời điểm mở đăng ký (ISO 8601)
          example: "2024-11-01T08:00:00Z"
        closesAt:
          type: string
          format: date-time
          description: Thời điểm đóng đăng ký (ISO 8601)
          example: "2024-11-07T17:00:00Z"
        status:
          type: string
          enum: [OPEN, CLOSED]
          description: Trạng thái đợt đăng ký
          example: OPEN
        creditLimit:
          type: integer
          minimum: 1
          maximum: 32767
          description: Giới hạn tín chỉ tối đa
          example: 24

    # ── Sections ──────────────────────────────────────────────────────────────
    SectionResponse:
      type: object
      required: [id, courseCode, term, lecturer, capacity, enrolledCount, session, courseName, credits, availableSeats]
      properties:
        id:
          type: integer
          format: int64
          description: ID lớp học phần
          example: 1001
        courseCode:
          type: string
          maxLength: 12
          description: Mã học phần
          example: "INT3306"
        term:
          type: string
          maxLength: 10
          description: Học kỳ
          example: "20241"
        lecturer:
          type: string
          maxLength: 100
          description: Tên giảng viên
          example: "Nguyễn Thị B"
        capacity:
          type: integer
          minimum: 1
          maximum: 32767
          description: Sĩ số tối đa
          example: 60
        enrolledCount:
          type: integer
          minimum: 0
          description: Số sinh viên đã đăng ký
          example: 45
        session:
          type: integer
          format: int32
          minimum: 1
          maximum: 268435455
          description: Mã ca học (bitmask)
          example: 3
        courseName:
          type: string
          description: Tên học phần
          example: "Cơ sở dữ liệu"
        credits:
          type: integer
          minimum: 1
          description: Số tín chỉ
          example: 3
        prerequisite:
          type: string
          nullable: true
          description: Mã học phần tiên quyết (null nếu không có)
          example: "INT2204"
        availableSeats:
          type: integer
          minimum: 0
          description: Số chỗ còn trống
          example: 15

    SectionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SectionResponse'
        nextCursor:
          type: integer
          format: int64
          nullable: true
          description: Con trỏ cho trang kế tiếp (null nếu là trang cuối)
          example: 1050

    SectionUpsertRequest:
      type: object
      required: [courseCode, term, lecturer, capacity, session]
      properties:
        courseCode:
          type: string
          maxLength: 12
          description: Mã học phần
          example: "INT3306"
        term:
          type: string
          maxLength: 10
          description: Học kỳ
          example: "20241"
        lecturer:
          type: string
          maxLength: 100
          description: Tên giảng viên
          example: "Nguyễn Thị B"
        capacity:
          type: integer
          minimum: 1
          maximum: 32767
          description: Sĩ số tối đa
          example: 60
        session:
          type: integer
          format: int32
          minimum: 1
          maximum: 268435455
          description: Mã ca học (bitmask)
          example: 3

    # ── Enrollments ───────────────────────────────────────────────────────────
    RegisteredResponse:
      allOf:
        - $ref: '#/components/schemas/SectionResponse'
        - type: object
          required: [enrollmentId, createdAt]
          properties:
            enrollmentId:
              type: integer
              format: int64
              description: ID bản ghi đăng ký
              example: 5001
            createdAt:
              type: string
              format: date-time
              description: Thời điểm đăng ký (ISO 8601 UTC)
              example: "2024-11-01T08:05:23Z"

    EnrollmentListResponse:
      type: object
      required: [items, creditsByTerm]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegisteredResponse'
        creditsByTerm:
          type: object
          additionalProperties:
            type: integer
          description: Tổng tín chỉ đã đăng ký phân theo học kỳ (key = term, value = tổng tín chỉ)
          example:
            "20241": 12
            "20232": 18

    EnrollmentRequest:
      type: object
      required: [sectionIds]
      properties:
        sectionIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64
            minimum: 1
          description: Danh sách ID lớp học phần muốn đăng ký
          example: [1001, 1002]

    EnrollmentCreateItem:
      type: object
      required: [enrollmentId, sectionId, createdAt]
      properties:
        enrollmentId:
          type: integer
          format: int64
          description: ID bản ghi đăng ký vừa tạo
          example: 5001
        sectionId:
          type: integer
          format: int64
          description: ID lớp học phần tương ứng
          example: 1001
        createdAt:
          type: string
          format: date-time
          description: Thời điểm đăng ký (ISO 8601 UTC)
          example: "2024-11-01T08:05:23Z"

    EnrollmentCreateResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentCreateItem'

    # ── Health ────────────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status, serverTime]
      properties:
        status:
          type: string
          description: Trạng thái hệ thống
          example: "UP"
        serverTime:
          type: string
          format: date-time
          description: Thời gian server (ISO 8601 UTC)
          example: "2024-11-01T09:30:00Z"

    # ── Error ─────────────────────────────────────────────────────────────────
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi máy đọc được
          example: VALIDATION_ERROR
        message:
          type: string
          description: Mô tả lỗi cho người đọc
          example: "Dữ liệu đầu vào không hợp lệ."
        details:
          type: object
          nullable: true
          description: Thông tin lỗi chi tiết (tuỳ endpoint)
          example:
            field: "password"
            issue: "must not be blank"

  responses:

    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            code: VALIDATION_ERROR
            message: "Dữ liệu đầu vào không hợp lệ."
            details:
              field: "code"
              issue: "must not be blank"

    Unauthorized:
      description: Chưa xác thực hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            code: UNAUTHORIZED
            message: "Token không hợp lệ hoặc đã hết hạn."
            details: null

    InvalidCredentials:
      description: Thông tin đăng nhập sai
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            code: INVALID_CREDENTIALS
            message: "Mã hoặc mật khẩu không đúng."
            details: null

    Forbidden:
      description: Không có quyền thực hiện thao tác này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            code: FORBIDDEN
            message: "Bạn không có quyền thực hiện thao tác này."
            details: null

    InternalError:
      description: Lỗi server nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            code: INTERNAL_ERROR
            message: "Đã xảy ra lỗi nội bộ. Vui lòng thử lại sau."
            details: null

    AuthNotConfigured:
      description: Hệ thống xác thực chưa được cấu hình
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            code: AUTH_NOT_CONFIGURED
            message: "Hệ thống xác thực chưa được cấu hình đúng."
            details: null
