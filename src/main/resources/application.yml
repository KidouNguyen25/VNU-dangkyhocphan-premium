server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: vnu-course-registration
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/dkhp}
    username: ${DB_USER:dkhp_api}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
      connection-init-sql: SET statement_timeout = '15s'
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  health-allowed-ips: ${HEALTH_ALLOWED_IPS:127.0.0.1,::1}
  rate-limit:
    ip: ${RATE_LIMIT_IP:600}
    account: ${RATE_LIMIT_ACCOUNT:120}
    login: ${RATE_LIMIT_LOGIN:10}
logging:
  level:
    org.springframework.web: INFO
    org.springframework.jdbc: WARN
