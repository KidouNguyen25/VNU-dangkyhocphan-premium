<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <h3>1. Đăng nhập</h3>
    <input id="code" type="text" placeholder="Mã SV" value="SV001">
    <input id="password" type="password" placeholder="Mật khẩu" value="123456">
    <button onclick="login()">Đăng nhập</button>
    <p id="tokenStatus">Trạng thái: Chưa đăng nhập</p>

    <hr>

    <h3>2. Danh sách Lớp Học Phần</h3>
    <button onclick="loadSections()">Tải danh sách</button>
    <div id="sectionsList"></div>

    <hr>

    <h3>3. Đăng ký Học phần</h3>
    <label>Section IDs (phân cách bằng dấu phẩy):</label><br>
    <input id="sectionIds" type="text" value="1"><br><br>
    
    <label>Idempotency Key:</label><br>
    <input id="idempotencyKey" type="text">
    <button onclick="genKey()">Tạo Key mới</button><br><br>

    <button onclick="enroll()">Gửi Đăng Ký</button>

    <hr>

    <h3>4. Hủy Đăng ký</h3>
    <input id="enrollmentId" type="number" placeholder="Enrollment ID">
    <button onclick="cancelEnrollment()">Hủy Đăng Ký</button>

    <hr>

    <h3>Kết quả API Response:</h3>
    <button onclick="document.getElementById('output').innerText = ''">Xóa log</button>
    <pre id="output">Chưa có dữ liệu...</pre>

    <script>
        const API_BASE = 'http://localhost:8080/api/v1';
        let authToken = '';

        function log(data) {
            document.getElementById('output').innerText = JSON.stringify(data, null, 2);
        }

        function genKey() {
            document.getElementById('idempotencyKey').value = 'key-' + Math.random().toString(36).substring(2, 10);
        }
        genKey();

        async function login() {
            const code = document.getElementById('code').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, password })
                });
                const data = await res.json();
                log(data);
                if (res.ok && data.accessToken) {
                    authToken = data.accessToken;
                    document.getElementById('tokenStatus').innerText = 'Trạng thái: Đã đăng nhập!';
                }
            } catch (err) { log({ error: err.message }); }
        }

        async function loadSections() {
            try {
                const res = await fetch(`${API_BASE}/sections?limit=20`, {
                      headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                const data = await res.json();
                log(data);
                if (data.items) {
                    let html = '<ul>';
                    data.items.forEach(s => {
                        html += `<li>ID: ${s.id} | ${s.courseCode} - ${s.courseName} | Sĩ số: ${s.enrolledCount}/${s.capacity}</li>`;
                    });
                    html += '</ul>';
                    document.getElementById('sectionsList').innerHTML = html;
                }
            } catch (err) { log({ error: err.message }); }
        }

        async function enroll() {
            const idsStr = document.getElementById('sectionIds').value;
            const sectionIds = idsStr.split(',').map(id => parseInt(id.trim())).filter(id => !isNaN(id));
            const key = document.getElementById('idempotencyKey').value;

            try {
                const res = await fetch(`${API_BASE}/enrollments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`,
                        'Idempotency-Key': key
                    },
                    body: JSON.stringify({ sectionIds })
                });
                const data = await res.json();
                log({ httpStatus: res.status, body: data });
                loadSections();
            } catch (err) { log({ error: err.message }); }
        }

        async function cancelEnrollment() {
            const id = document.getElementById('enrollmentId').value;
            try {
                const res = await fetch(`${API_BASE}/enrollments/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = res.status === 204 ? { message: "Hủy thành công (204 No Content)" } : await res.json();
                log(data);
                loadSections();
            } catch (err) { log({ error: err.message }); }
        }
    </script>
</body>
</html>
