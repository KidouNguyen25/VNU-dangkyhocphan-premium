name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build và chạy kiểm thử
        run: sh ./mvnw -B -ntp test
      - name: Lưu báo cáo kiểm thử khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEED_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Tạo .env tạm với bí mật ngẫu nhiên
        run: |
          {
            echo "POSTGRES_DB=dkhp"
            echo "POSTGRES_USER=dkhp_app"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_USER=dkhp_api"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48)"
          } > .env
      - name: Dựng PostgreSQL và API
        run: docker compose up -d --build
      - name: Chờ API sẵn sàng
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v3/api-docs || true)
            [ "$code" = 200 ] && exit 0
            sleep 2
          done
          echo "API không sẵn sàng sau 120 giây"; exit 1
      - name: Nạp dữ liệu mẫu
        run: |
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v pw="$0" -v students=5 -f -' "$SEED_PASSWORD" < docker/seed/seed_dev.sql
      - name: Kiểm tra nhanh đăng nhập, xác thực, đăng ký
        run: |
          B=http://127.0.0.1:8080/api/v1
          expect() { [ "$1" = "$2" ] || { echo "$3: mong $2, nhận $1"; exit 1; }; }
          expect "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/auth/login -H 'Content-Type: application/json' -d '{"code":"SV00001","password":"sai"}')" 401 "login sai mật khẩu"
          expect "$(curl -s -o /dev/null -w '%{http_code}' $B/me)" 401 "me thiếu token"
          TOKEN=$(curl -s -X POST $B/auth/login -H 'Content-Type: application/json' -d "{\"code\":\"SV00001\",\"password\":\"$SEED_PASSWORD\"}" | sed -E 's/.*"accessToken":"([^"]+)".*/\1/')
          [ -n "$TOKEN" ] && [ "${#TOKEN}" -gt 100 ] || { echo "không lấy được token"; exit 1; }
          expect "$(curl -s -o /dev/null -w '%{http_code}' $B/me -H "Authorization: Bearer $TOKEN")" 200 "me có token"
          enroll() { curl -s -o /dev/null -w '%{http_code}' -X POST $B/enrollments -H "Authorization: Bearer $TOKEN" -H "Idempotency-Key: $1" -H 'Content-Type: application/json' -d "{\"sectionIds\":[$2]}"; }
          expect "$(enroll k1 2)" 201 "đăng ký lớp 2"
          expect "$(enroll k1 2)" 201 "gửi lại cùng Idempotency-Key"
          expect "$(enroll k2 1)" 409 "trùng học phần"
          expect "$(enroll k3 8)" 422 "trùng ca học"
      - name: In nhật ký khi lỗi
        if: failure()
        run: docker compose logs --no-color
      - name: Dọn
        if: always()
        run: docker compose down -v
